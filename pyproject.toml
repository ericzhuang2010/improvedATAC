[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[project]
name = "improvedATAC"
version = "0.1.0"
description = "ATAC-native probabilistic deconvolution with learned peak selection"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "anndata",
    "scanpy",
    "torch>=2.0",
    "pyro-ppl>=1.8",
    "matplotlib",
    "tqdm",
]

[project.optional-dependencies]
dev = [
    "pre-commit",
    "pytest",
    "pytest-cov",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
src = ["src"]
line-length = 120
